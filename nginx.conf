# Despliegue en ruta raíz '/' (coincide con ARG VITE_BASE_PATH=/ en dockerfile).
# Si se despliega bajo un subdirectorio (ej. /arona/), actualizar VITE_BASE_PATH y este bloque location.
server {
    listen 80;
    server_name localhost;

    # 1. Servir archivos estáticos del Frontend React (SPA con fallback a index.html)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy inverso hacia Backend Java WebFlux (Kubernetes / EC2)
    location /api/ {
        proxy_pass http://10.0.132.169:8085/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. Proxy inverso hacia Backend Analítico (Python Flask)
    location /analytics/ {
        proxy_pass http://10.0.142.239:5000/api/analytics/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
